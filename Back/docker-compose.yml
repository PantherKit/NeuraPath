

services:
  mongodb:
    image: mongo:7.0
    container_name: neurapath_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: neurapath
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - neurapath_network

  api:
    build: .
    container_name: neurapath_api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - MONGODB_URL=mongodb://admin:password123@mongodb:27017/neurapath?authSource=admin
      - MONGODB_DB_NAME=neurapath
    depends_on:
      - mongodb
    volumes:
      - .:/app
    networks:
      - neurapath_network

volumes:
  mongodb_data:

networks:
  neurapath_network:
    driver: bridge